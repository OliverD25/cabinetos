[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/OliverD25/cabinetos"
publish = false

[workspace.dependencies]
# Workspace crates
cabinetos-commands = { path = "crates/cabinetos-commands" }
cabinetos-config = { path = "crates/cabinetos-config" }
cabinetos-diag = { path = "crates/cabinetos-diag" }
cabinetos-fs = { path = "crates/cabinetos-fs" }
cabinetos-index = { path = "crates/cabinetos-index" }
cabinetos-indexer = { path = "crates/cabinetos-indexer" }
cabinetos-ipc = { path = "crates/cabinetos-ipc" }
cabinetos-jobs = { path = "crates/cabinetos-jobs" }
cabinetos-plugins = { path = "crates/cabinetos-plugins" }
cabinetos-protocol = { path = "crates/cabinetos-protocol" }
cabinetos-terminal = { path = "crates/cabinetos-terminal" }

# External crates. Each crate adds the features it needs on top of these.
anyhow = "1.0"
bytes = { version = "1.11", default-features = false }
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
memchr = "2.8"
rand = "0.10"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = "1.53"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
ulid = "3.0"
wasmtime = { version = "49.0.1", default-features = false }
wasmtime-wasi = { version = "49.0.1", default-features = false }
windows = "0.62"
windows-service = "0.8.1"

[profile.release]
# Line tables only: crash traces from release builds name file and line, and
# the MSVC linker puts the tables in a separate .pdb, so the .exe stays small.
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Every unsafe block must carry a `// SAFETY:` comment (CLAUDE.md working rules).
undocumented_unsafe_blocks = "warn"
