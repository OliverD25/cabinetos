[package]
name = "cabinetos-cli"
description = "Command-line client for the core's pipe; tests the core with no UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
cabinetos-cli-args.workspace = true
cabinetos-commands.workspace = true
cabinetos-config.workspace = true
cabinetos-diag.workspace = true
cabinetos-fs.workspace = true
cabinetos-ipc.workspace = true
cabinetos-protocol.workspace = true
cabinetos-terminal.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
