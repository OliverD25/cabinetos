[package]
name = "cabinetos-fs"
description = "Directory enumeration, metadata hydration, volume detection and change watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cabinetos-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows = { workspace = true, features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_System_Time",
] }

[dev-dependencies]
# The benchmark writes into a real shared-memory section.
cabinetos-ipc.workspace = true
criterion.workspace = true
tempfile.workspace = true
# StrCmpLogicalW, to check the sort order against Explorer's in tests only.
windows = { workspace = true, features = ["Win32_UI_Shell"] }

[[bench]]
name = "list_directory"
harness = false

[lints]
workspace = true
