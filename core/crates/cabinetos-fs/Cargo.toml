[package]
name = "cabinetos-fs"
description = "Directory enumeration, metadata hydration, volume detection and change watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cabinetos-protocol.workspace = true
crossbeam-channel.workspace = true
png.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows = { workspace = true, features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The benchmark writes into a real shared-memory section.
cabinetos-ipc.workspace = true
criterion.workspace = true
tempfile.workspace = true
# The shell menu's clipboard test reads the clipboard.
windows = { workspace = true, features = ["Win32_System_DataExchange"] }

[[bench]]
name = "list_directory"
harness = false

[lints]
workspace = true
