[package]
name = "cabinetos-protocol"
description = "The IPC contract: control-channel messages, request IDs and shared-memory layouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# JSON Schema export of the control-channel messages (checked into sdk/protocol/).
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true

[dev-dependencies]
# Turns on the `schema` feature for this crate's own tests, so the schema
# snapshot test runs under a plain `cargo test --workspace`.
cabinetos-protocol = { path = ".", features = ["schema"] }

[lints]
workspace = true
