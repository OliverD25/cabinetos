[package]
name = "cabinetos-diag"
description = "Structured JSON Lines diagnostics, a ring buffer of recent events and crash traces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cabinetos-protocol.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
# `ansi` provides the pretty stderr format.
tracing-subscriber = { workspace = true, features = ["ansi"] }
# Log bundles: zips written with Deflate.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
