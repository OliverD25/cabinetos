name: CI

# On demand, never on a plain push (2026-09-29): the account's 2,000 free
# minutes a month ran out in September (Windows runners count double, and
# cold builds take 36 minutes), and the creator spends no money on CI.
# Every change is verified on the development PC first; CI runs once per
# accepted phase, started by hand with `gh workflow run ci.yml`, and on
# pull requests into main. To run on every push again, restore the `push`
# trigger this replaced (git history of this file).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "sdk/protocol/**"
      - "sdk/config/**"
      # The plugin host compiles against the WIT, and its tests load the fixtures.
      - "sdk/wit/**"
      - "sdk/fixtures/**"
      # The core embeds the shipped themes; a test checks the theme schema.
      - "sdk/themes/**"
      # A test checks the marketplace index schema.
      - "sdk/marketplace/**"
      # The WinUI shell; its tests also read sdk/protocol and sdk/config.
      - "ui/**"
      # Tool Extensions; the shell's tests check the shipped tool.json against its schema.
      - "sdk/tools/**"
      # The release and install scripts are parsed.
      - "build/**"
      - ".github/workflows/ci.yml"

# No workflow-wide concurrency group: each job has its own, so a new run
# cancels only the same job's older run. The `changes` job decides which
# jobs run, so a pull request that touches only ui/ never starts (or
# cancels) a core check. A run started by hand runs every job.

jobs:
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.diff.outputs.core }}
      ui: ${{ steps.diff.outputs.ui }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the diff reaches the previous push.
          fetch-depth: 0

      - name: Compare with the pull request's base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then from="$BASE"; else from="$BEFORE"; fi
          # A run started by hand has nothing to compare with (nor has a new
          # branch or a force push): run everything.
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "no earlier commit to compare with; every job runs"
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$from" "$HEAD")"
          printf 'changed since %s:\n%s\n' "$from" "$changed"
          touches() {
            if printf '%s\n' "$changed" | grep -Eq "$1"; then echo true; else echo false; fi
          }
          # The same paths as the trigger above, split by the job that needs them.
          echo "core=$(touches '^(core/|sdk/(protocol|config|wit|fixtures|themes|marketplace)/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          # The shell's theme tests map the shipped themes of sdk/themes.
          echo "ui=$(touches '^(ui/|sdk/(protocol|config|tools|themes)/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "scripts=$(touches '^(build/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  core:
    name: Rust core (fmt, clippy, test, release build, benches compile)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    concurrency:
      group: core-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    # A hung test must not burn hours of paid Windows minutes. A run without
    # the cache builds wasmtime twice (debug and release) and took 33 minutes
    # on 2026-09-28; with the cache it is much shorter. The first run after
    # new dependencies (the marketplace's TLS stack, 2026-09-28) needed 41
    # minutes for its steps and 4 more to save the cache, which a 45-minute
    # limit cut off, so the next run would have started cold again.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in core/rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          # The runner is thrown away after the run, so the test that sends
          # a file to the Recycle Bin may run here (it is skipped elsewhere).
          CABINETOS_TEST_RECYCLE_BIN: "1"

      - name: Release build
        run: cargo build --workspace --release

      # Reading the MFT and the change journal needs Administrator rights.
      # These tests are ignored elsewhere and skip when not elevated; the
      # runner is an Administrator, so they run here, in release mode for
      # realistic build and search times (printed in the log).
      - name: Elevated tests (index, indexer)
        run: cargo test --release -p cabinetos-index -p cabinetos-indexer -- --ignored --nocapture
        env:
          # Installs, starts, stops and removes the cabinetos-indexer
          # service; allowed here because the runner is thrown away.
          CABINETOS_TEST_SERVICE: "1"

      # Benchmarks need a quiet machine and a 100,000-file fixture; CI only
      # checks that they still compile. Run them locally (core/README.md).
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  ui:
    name: WinUI shell (build, test)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    concurrency:
      group: ui-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    # Restore, a Release build and the tests take a few minutes; a hang
    # must not burn paid Windows minutes.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      # ui/global.json pins the SDK and turns on the Microsoft.Testing.Platform
      # mode of dotnet test that xunit v3 needs.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ui/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ui/Directory.Packages.props', 'ui/**/*.csproj') }}

      - name: Restore
        run: dotnet restore CabinetOS.sln

      - name: Build (warnings are errors)
        run: dotnet build CabinetOS.sln -c Release --no-restore -warnaserror

      # This job builds no cabinetos-core.exe, so the end-to-end test skips
      # itself here; locally it runs against core/target/debug. The core job
      # tests the core.
      - name: Test
        run: dotnet test --solution CabinetOS.sln -c Release --no-build

  deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    concurrency:
      group: deny-${{ github.ref }}
      cancel-in-progress: true
    # cargo-deny-action runs in a Docker container, and GitHub runs container
    # actions only on Linux runners. deny.toml limits the check to the
    # Windows targets, so the result is the same as on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          # Unmaintained crates are reported without failing the build;
          # deny.toml explains why this cannot live in the config file.
          command-arguments: --warn unmaintained

  scripts:
    name: PowerShell scripts parse (build/)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    concurrency:
      group: scripts-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # install.ps1 and uninstall.ps1 must parse in Windows PowerShell 5.1,
      # which every Windows 11 has; release.ps1 and notices.ps1 need 7.
      - name: Parse in PowerShell 7
        shell: pwsh
        run: ./build/check-scripts.ps1

      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: ./build/check-scripts.ps1
