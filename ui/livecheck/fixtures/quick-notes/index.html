<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Scripts only from the tool itself, as the shipped tools do. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Quick Notes</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; padding: 12px; font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; background: transparent; color: CanvasText; }
    h1 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .6; }
    p { margin: 4px 0; overflow-wrap: anywhere; }
    textarea { box-sizing: border-box; width: 100%; height: 120px; margin-top: 8px; padding: 6px; font: inherit; color: inherit; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Quick Notes</h1>
  <p>Folder: <span id="folder">(waiting)</span></p>
  <p>Told <span id="count">0</span> times</p>
  <textarea id="note" aria-label="A note" placeholder="Type here"></textarea>
  <script src="notes.js"></script>
</body>
</html>
