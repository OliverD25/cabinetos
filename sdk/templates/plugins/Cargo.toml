# The sample Core Plugins and the test fixtures, built as WebAssembly
# components. `hello` is the template for new plugins; the others exist to
# test the host (docs/plugins.md). Rebuild the committed fixtures with
# ../build-fixtures.ps1.
[workspace]
resolver = "3"
members = ["crashy", "fetcher", "hello", "hog", "reader", "spinner", "vetoer", "watcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1.0"
wit-bindgen = "0.61.1"

[profile.release]
# Small components: size matters more than speed for these.
opt-level = "s"
lto = true
codegen-units = 1
# Drop the debug info but keep the function names: the core's crash log
# then shows a backtrace with names instead of bare function numbers.
strip = "debuginfo"
