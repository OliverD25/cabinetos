<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Scripts only from the tool itself; the file and its images from the
    window's file hosts (https://f<n>.markdown-preview.cabinetos.example).
    No other origin, and no inline script, so HTML inside a Markdown file
    cannot run code. The window blocks every other request as well.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://*.cabinetos.example data:; connect-src https://*.cabinetos.example; font-src 'self'; base-uri https://*.cabinetos.example; form-action 'none'">
  <base id="base" href="/">
  <title>Markdown Preview</title>
  <link rel="stylesheet" href="/preview.css">
  <script src="/marked/marked.umd.js"></script>
  <script src="/preview.js" defer></script>
</head>
<body>
  <main id="content"></main>
</body>
</html>
