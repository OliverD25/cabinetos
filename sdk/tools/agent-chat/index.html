<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Scripts and styles only from the tool itself, and no connection at all:
    the page talks to the window, and the window to the agent plugin. The
    model's words are put in with textContent, never as HTML.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Chat</title>
  <link rel="stylesheet" href="/chat.css">
  <script src="/chat.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>Agent</h1>
    <div class="tiers" role="radiogroup" aria-label="How much the agent may do">
      <button type="button" role="radio" aria-checked="false" data-tier="1" title="Looks and advises. It changes nothing.">Advisor</button>
      <button type="button" role="radio" aria-checked="false" data-tier="2" title="It proposes changes as a preview. You apply them.">Diff and approve</button>
      <button type="button" role="radio" aria-checked="false" data-tier="3" title="It applies changes at once. You can undo them.">Autonomous</button>
    </div>
    <button type="button" id="undo" title="Undo the last changes the agent made">Undo</button>
    <button type="button" id="log" aria-pressed="false" title="What the agent was asked and what it did">Log</button>
  </header>
  <p id="tier-note" class="note" role="status"></p>
  <main id="thread" aria-live="polite">
    <p id="empty" class="empty">Ask in your own words, for example &ldquo;put the photos of last summer in a folder of their own&rdquo;. Drag files from a pane onto this page to point at them.</p>
  </main>
  <section id="audit" hidden aria-label="The agent's log"></section>
  <form id="composer" autocomplete="off">
    <div id="attached" class="chips" hidden></div>
    <label id="use-selection" class="check" hidden><input type="checkbox" id="use-selection-box" checked> <span id="use-selection-text"></span></label>
    <textarea id="input" rows="2" placeholder="What should the agent do?" aria-label="Message to the agent"></textarea>
    <div class="actions">
      <span id="hint" class="hint">Enter sends, Shift+Enter starts a new line</span>
      <button type="submit" id="send" class="primary">Send</button>
    </div>
  </form>
</body>
</html>
